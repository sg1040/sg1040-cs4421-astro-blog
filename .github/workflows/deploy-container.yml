name: Deploy Container to AWS

on:
  push:
    branches:
      - ssr

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    env:
      AWS_REGION: us-east-1
      ECS_CLUSTER: EcsStack-EcsDefaultClusterMnL3mNNYNVpc18E0451A-HnEXwsLa23lV
      ECS_SERVICE: EcsStack-AstroService03ADA2BA-frd0FJrVOAjR

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Root Dependencies
        run: npm ci

      - name: Run Astro Tests
        run: npm run test:unit

      - name: Install CDK Dependencies
        working-directory: cdk
        run: npm ci

      - name: Run CDK Tests
        working-directory: cdk
        run: npm test

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Get ECR Repository Details
        run: |
          REPOSITORY_URI=$(aws cloudformation describe-stacks \
            --stack-name EcrStack \
            --region $AWS_REGION \
            --query 'Stacks[0].Outputs[?OutputKey==`RepositoryUri`].OutputValue' \
            --output text)

          echo "REPOSITORY_URI=$REPOSITORY_URI" >> $GITHUB_ENV
          echo "ECR_REPOSITORY=${REPOSITORY_URI#*/}" >> $GITHUB_ENV

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and Push Docker Image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $REPOSITORY_URI:$IMAGE_TAG .
          docker tag $REPOSITORY_URI:$IMAGE_TAG $REPOSITORY_URI:latest

          docker push $REPOSITORY_URI:$IMAGE_TAG
          docker push $REPOSITORY_URI:latest

      - name: Deploy to ECS
        run: |
          aws ecs update-service \
            --cluster $ECS_CLUSTER \
            --service $ECS_SERVICE \
            --force-new-deployment