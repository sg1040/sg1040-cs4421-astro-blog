name: Deploy Static Astro Site to S3 and CloudFront

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            cdk/cdk/cdk/package-lock.json

      - name: Install Astro dependencies
        run: npm ci

      - name: Build static Astro site
        run: npm run build

      - name: Install CDK dependencies
        run: npm ci
        working-directory: cdk/cdk/cdk

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Deploy S3 and CloudFront
        run: npx cdk deploy CdkStack --require-approval never
        working-directory: cdk/cdk/cdk
